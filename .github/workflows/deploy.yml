name: Build & Deploy 保管庫

on:
  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# デプロイ同士がぶつからないようにする（進行中のデプロイはキャンセルしない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 重複取り込み・全文転載・frontmatter 不備をここで止める
      - name: 記事の検査
        run: python3 scripts/check_articles.py

      - name: サイト生成
        run: python3 scripts/build_site.py

      # Pages の有効化はリポジトリ設定で済ませてある
      # （Settings > Pages > Source: GitHub Actions）。
      # GITHUB_TOKEN では Pages サイトを新規作成できないため enablement は使わない。
      - name: Pages の設定
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
